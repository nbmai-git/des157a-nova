            <h1>Experiment 2: Javescript DOM</h1>

            <p id = textcolor>Challenge: Make the color of this text change depending on user input of a color.</p>


            <script>

            //prompts a user for a color, then runs a function that changes the text color based on input

            var color = prompt ("Enter a color (red, green, blue, or yellow)", "");

            function colorchange () {
            if (color === "red") {
		    var changecolor = document.querySelector('#textcolor');
		    changecolor.className = "red";
            }
            else if (color === "blue") {
		    var changecolor = document.querySelector('#textcolor');
		    changecolor.className = "blue";
            }
            else if (color === "green") {
		    var changecolor = document.querySelector('#textcolor');
		    changecolor.className = "green";
            }
            else {
            var changecolor = document.querySelector('#textcolor');
		    changecolor.className = "yellow";
            }
            console.log("color");
            }

            colorchange ();


            </script>
