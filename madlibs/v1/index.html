<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <title>Madlibs Version 1</title>

    <link href = "styles.css" rel = "stylesheet">  
    <script src = "script.js" defer></script>

</head>


<body>
    

 <div class="bg-images">

    <main>

        <div id = window>

        <button id = close>X</button>

        <h1>Madlibs V1</h1>

        <p>Hello! Welcome to my Madlibs Game. Please enter the inputs below 
            to generate your custom story!
        </p>

        <form>

            <label for = "name">Your Name: </label>
            <input type = "text" id="name" required>

            <label for = "food">Enter a food: </label>
            <input type = "text" id="food" required>

             <label for = "verb1">Enter a verb: </label>
            <input type = "text" id="verb1" required>

            <label for = "adj1">Enter a adjective: </label>
            <input type = "text" id="adj1" required>

            <label for = "fruitcount">Enter a number: </label>
            <input type = "number" id= "fruitcount" required>

            <label for = "costcount">Enter another number: </label>
            <input type = "number" id= "costcount" required>


        </form>

         <button id = send>Send to Madlibs!</button>

        </div>

    </main>

    </div> <!--end of background images-->

</body>


</html>
