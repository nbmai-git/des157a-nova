<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <title>Madlibs Version 2</title>

    <link href = "styles.css" rel = "stylesheet">  
    <script src = "script.js" defer></script>

</head>


<body>
 <div class="bg-images">


     <a id = "home" href="../../index.html">Return to Home</a>

    <main>

        <div id = window>

        <button id = close>X</button>

        <h1>Madlibs V2</h1>

        <p>Hello! Welcome to my Madlibs Game. Please enter the inputs below 
            to generate your custom story!
        </p>

        <form id = "myform">

        <div class = "form-row">
            <div class = inputs>
            <label for = "name">Your Name: </label>
            <input type = "text" id= "name" required>
            
            <label for = "location">A location: </label>
            <input type = "text" id= "location" required>

            <label for = "emotion1">A emotion: </label>
            <input type = "text" id= "emotion1" required>
            </div> <!--end of inputs-->
        </div> <!--end of row-->



        <div class = "form-row">
            <div class = inputs>
            <label for = "object">A object: </label>
            <input type = "text" id= "object" required>

            <label for = "verb1">A verb: </label>
            <input type = "text" id= "verb1" required>

            <label for = "adj1">A adjective: </label>
            <input type = "text" id= "adj1" required>
             </div> <!--end of inputs-->
        </div> <!--end of row-->


        <div class = "form-row">
            <div class = inputs>
            <label for = "count">A number: </label>
            <input type = "text" id= "count" required>

            <label for = "verb2">Another verb: </label>
            <input type = "text" id="verb2" required>

            <label for = "time">Another number: </label>
            <input type = "text" id= "time" required>
            </div>  <!--end of inputs-->
        </div> <!--end of row-->


         <div class = "form-row">
            <div class = inputs>
            <label for = "emotion2">A emotion: </label>
            <input type = "text" id= "emotion2" required>
            
                <br><br><br><br><br><br>

            <div id = buttons>
            <!--<button id = clear>Clear Inputs</button>-->
            <button id = send type = "submit">Create my Madlibs Story!</button>
            </div> <!-- end of buttons-->

        
            </div>  <!--end of inputs-->
        </div> <!--end of row-->
        


              
        

        </form>

         <article id="madlibstory">story goes here</article>



          </div> <!--end of window-->

    </main>

    </div> <!--end of background images-->

</body>


</html>
