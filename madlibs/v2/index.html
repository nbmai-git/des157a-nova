<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Madlibs Version 2</title>

    <link href = "styles.css" rel = "stylesheet">

<body>
 <div class="bg-images">


     <a id = "home" href="../../index.html">Return to Home</a>

    <main>

        <div id = window>

        <button id = close>X</button>

        <h1>Madlibs V2</h1>

        <p>Hello! Welcome to my Madlibs Game. Please enter the inputs below 
            to generate your custom story!
        </p>

        <form id = "myform">

            <div id = inputs>
            <label for = "name">Your Name: </label>
            <input type = "text" id= "name" required>

            <label for = "location">Enter a location: </label>
            <input type = "text" id= "location" required>

            <label for = "emotion1">Enter a emotion: </label>
            <input type = "text" id= "emotion1" required>

            <label for = "object">Enter a object: </label>
            <input type = "text" id= "object" required>

            <label for = "verb1">Enter a verb: </label>
            <input type = "text" id= "verb1" required>

            <label for = "adj1">Enter a adjective: </label>
            <input type = "text" id= "adj1" required>

            <label for = "count">Enter a number: </label>
            <input type = "text" id= "count" required>

            <label for = "verb2">Enter another verb: </label>
            <input type = "text" id="verb2" required>

            <label for = "time">Enter another number: </label>
            <input type = "text" id= "time" required>

            <label for = "emotion2">Enter a emotion: </label>
            <input type = "text" id= "emotion2" required>

            </div>

            <div id = buttons>
            <!--<button id = clear>Clear Inputs</button>-->
            <button id = send type = "submit">Create my Madlibs Story!</button>
            </div>

        </form>


         <article id="madlibstory">story goes here</article>



        
    


        </div>

    </main>

    </div> <!--end of background images-->

</body>
